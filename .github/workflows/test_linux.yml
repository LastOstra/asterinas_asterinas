name: Test on Linux

on:
  workflow_dispatch:
  pull_request:
    paths: &linux_test_paths
      - '.github/workflows/test_linux.yml'
      - 'Makefile'
      - 'test/initramfs/**'
      - 'tools/qemu_args.sh'
  push:
    branches:
      - main
    paths: *linux_test_paths

jobs:
  regression-test:
    runs-on: ubuntu-latest
    container:
      image: asterinas/kernel-dev:0.19.0-20261012
      options: -v /dev:/dev --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Build Linux regression tests and initramfs
        run: |
          make initramfs AUTO_TEST=regression REGRESSION_TEST_PLATFORM=linux

      - name: Run regression tests on Linux
        shell: bash
        run: |
          qemu_args=$(make --no-print-directory qemu-args AUTO_TEST=regression QEMU_DISPLAY=none)
          read -r -a qemu_args <<< "$qemu_args"
          timeout 2m qemu-system-x86_64 "${qemu_args[@]}" \
            -accel kvm -snapshot \
            -kernel /opt/linux_binary_cache/vmlinuz \
            -initrd test/initramfs/build/initramfs.cpio.gz \
            -append 'console=hvc0 PATH=/bin:/sbin -- /test/run_regression_test_on_linux.sh' \
            </dev/null 2>&1 | tee regression-linux.log

          # The init script powers off even if the test command fails.
          tr -d '\r' < regression-linux.log | grep -Fx 'All regression tests on Linux passed.'
